<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Projeto prático</title>
</head>
    
<body>
    <img class="Logo" src="./assets/logo.gif" alt="Logo ConvertMoney">
    
    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>Real Brasileiro</option>
            </select>
        </label>
        
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">Dolar Americano</option>
                <option value="euro">Euro</option>
                <option value="libra">Libra</option>
            </select>
        </label>
        <label>
            Valor
            <Input class="input-corrency" placeholder="R$ 10.000,00"></Input>
        </label>

        <button class="btnConvert">Converter</button>

        <section>
            <div class="currency-box">
                <img class="logo-brasil" src="./assets/Real.png" alt="Moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>

            <div class="arrow-img">
                <img src="./assets/Arrow.png" alt="Seta">
            </div>

            <div class="currency-box">
                <img class="currency-img" src="./assets/Dolar.png" alt="Moeda-convertida">
                <p class="currency" id="currency-name">Dolar</p>
                <p class="currency-value-converted">R$ 0,00</p>
            </div>
            
        </section>
        
    </main>
</body>

<script src="./script.js"></script>

</html>
